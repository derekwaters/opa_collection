---
- name: Test opa policy
  hosts: all
  connection: local

  tasks:
    - name: Create a policy
      ansible.builtin.include_role:
        name: "derekwaters.opa.policy"
      vars:
        opa_host: localhost
        opa_port: 8181
        opa_policy:
          namespace: collection_test
          state: present
          data: | 
            package collection_test

            default allowed := {
              "allowed": true,
              "violations": [],
            }

            default has_change_or_incident := false

            has_change_or_incident if {
              count(input.extra_vars.change_number) > 0
            }

            has_change_or_incident if {
              count(input.extra_vars.incident_number) > 0
            }

            allowed := {
              "allowed": false,
              "violations": ["No change or incident number supplied"],
            } if {
              has_change_or_incident == false
            }

    - name: Debug the results
      ansible.builtin.debug:
        var: opa_policy_result

    - name: Update a policy
      ansible.builtin.include_role:
        name: "derekwaters.opa.policy"
      vars:
        opa_host: localhost
        opa_port: 8181
        opa_policy:
          namespace: collection_test
          state: present
          data: | 
            package aap_tests

            default allowed := {
              "allowed": true,
              "violations": [],
            }

            violating_credentials := {cred.name | cred := input.credentials[_]; cred.organization == null}

            default has_change_or_incident := false

            has_change_or_incident if {
              count(input.extra_vars.change_number) > 0
            }

            has_change_or_incident if {
              count(input.extra_vars.incident_number) > 0
            }

            allowed := {
              "allowed": false,
              "violations": ["No change or incident number supplied"],
            } if {
              has_change_or_incident == false
            }

            allowed := {
              "allowed": false,
              "violations": ["Credential with no Organization"],
            } if {
              count(violating_credentials) > 0
            }
      
    - name: Debug the results
      ansible.builtin.debug:
        var: opa_policy_result

    - name: Query a policy
      ansible.builtin.include_role:
        name: "derekwaters.opa.query"
      vars:
        opa_host: localhost
        opa_port: 8181
        opa_policy_namespace: collection_test
        opa_policy_rule: allowed
        opa_input_data:
          extra_vars:
            change_number: "CHG-001"
      
    - name: Debug the results
      ansible.builtin.debug:
        var: opa_query_result

    - name: Query a policy (fail)
      ansible.builtin.include_role:
        name: "derekwaters.opa.query"
      vars:
        opa_host: localhost
        opa_port: 8181
        opa_policy_namespace: collection_test
        opa_policy_rule: allowed
        opa_input_data:
          extra_vars:
            some_value: "something"
      
    - name: Debug the results
      ansible.builtin.debug:
        var: opa_query_result

    - name: Delete a policy
      ansible.builtin.include_role:
        name: "derekwaters.opa.policy"
      vars:
        opa_host: localhost
        opa_port: 8181
        opa_policy:
          namespace: collection_test
          state: absent

    - name: Debug the results
      ansible.builtin.debug:
        var: opa_policy_result

    - name: Query a missing policy
      ansible.builtin.include_role:
        name: "derekwaters.opa.query"
      vars:
        opa_host: localhost
        opa_port: 8181
        opa_policy_namespace: collection_test
        opa_policy_rule: allowed
        opa_input_data:
          extra_vars:
            some_value: "something"
      
    - name: Debug the results
      ansible.builtin.debug:
        var: opa_query_result